name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded run proves nothing. Cancel it rather than paying for it.
# Never cancel on main: those runs gate deployment.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static checks and build. No database, so this runs on every PR including
  # from forks.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` not `install`: fails if package-lock.json and package.json disagree,
      # rather than silently resolving to something no one has run locally.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # End-to-end against a production build. Since LL-010 the app under test
  # authenticates, so this job provisions its own ephemeral Neon branch — same
  # pattern and same fork-guard as the integration job.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      E2E_BRANCH: test/e2e-run-${{ github.run_id }}
      # Synthetic, per run, never reused anywhere. The app under test just needs
      # A secret; it protects nothing beyond this throwaway branch.
      BETTER_AUTH_SECRET: SYNTHETIC-CI-E2E-SECRET-${{ github.run_id }}-0000000000
    steps:
      - name: Require Neon credentials
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error title=Missing GitHub secrets::NEON_API_KEY / NEON_PROJECT_ID"
            echo "E2E authenticates against a real database since LL-010. Failing rather"
            echo "than skipping — unrun tests must never look like a pass."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Browsers are cached but system libraries are not.
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Create ephemeral Neon branch
        run: |
          set -euo pipefail
          npx --yes neonctl@2.15.0 branches create \
            --project-id "$NEON_PROJECT_ID" --name "$E2E_BRANCH" --output json > /dev/null
          POOLED=$(npx --yes neonctl@2.15.0 connection-string "$E2E_BRANCH" \
            --project-id "$NEON_PROJECT_ID" --pooled --output json | tr -d '"')
          DIRECT=$(npx --yes neonctl@2.15.0 connection-string "$E2E_BRANCH" \
            --project-id "$NEON_PROJECT_ID" --output json | tr -d '"')
          echo "::add-mask::$POOLED"
          echo "::add-mask::$DIRECT"
          echo "DATABASE_URL=$POOLED" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$DIRECT" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: npm run db:migrate

      - run: npm run test:e2e

      - name: Delete ephemeral Neon branch
        if: always()
        run: |
          npx --yes neonctl@2.15.0 branches delete "$E2E_BRANCH" \
            --project-id "$NEON_PROJECT_ID" || \
            echo "::warning title=Branch cleanup failed::$E2E_BRANCH may still exist; the reaper will remove it"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Database-backed integration tests against a throwaway Neon branch.
  #
  # Skipped for pull requests from forks: secrets are not available there, and
  # exposing a database credential to code from an untrusted fork would be worse
  # than losing the coverage.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (ephemeral Neon branch)
    runs-on: ubuntu-latest
    # The database-backed suite runs its files serially against one Neon branch
    # (parallel files would truncate tables mid-assertion — see vitest.config.mts),
    # and Neon compute latency varies run to run: real durations have ranged from
    # ~3 to ~16 minutes as Sprint 3/4 added concurrency-heavy tests. 30 gives a slow
    # Neon day headroom so it never times out a green suite. Splitting into parallel
    # jobs was rejected: it would add a second concurrent Neon branch, and the
    # contention (not the test count) is the actual cause of the slow runs.
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      # Branch name is unique per run, so a re-run never collides with itself.
      BRANCH_NAME: test/pr-${{ github.event.pull_request.number || 'push' }}-run-${{ github.run_id }}
      APP_ENV: test
    steps:
      # This job FAILS rather than skips when secrets are absent. A skipped job
      # renders as a grey tick that reads like success, and "integration tests
      # never actually ran" is precisely the thing that must not go unnoticed in
      # an accounting codebase.
      - name: Require Neon credentials
        run: |
          missing=()
          [ -z "$NEON_API_KEY" ] && missing+=("NEON_API_KEY")
          [ -z "$NEON_PROJECT_ID" ] && missing+=("NEON_PROJECT_ID")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing GitHub secrets::${missing[*]}"
            echo ""
            echo "Integration tests cannot run without an ephemeral Neon branch."
            echo "Add these repository secrets (Settings -> Secrets and variables -> Actions):"
            echo ""
            echo "  NEON_API_KEY     Neon console -> Account settings -> API keys"
            echo "  NEON_PROJECT_ID  Neon console -> Project settings -> General"
            echo ""
            echo "This job fails rather than skipping on purpose. A skipped job looks"
            echo "like a pass, and unrun integration tests must never look like a pass."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # neonctl is pinned. An unpinned CLI is an unreviewed dependency with
      # credentials, resolved fresh on every run.
      - name: Create ephemeral Neon branch
        id: neon
        run: |
          npx --yes neonctl@2.15.0 branches create \
            --project-id "$NEON_PROJECT_ID" \
            --name "$BRANCH_NAME" \
            --output json > /tmp/branch.json

          POOLED=$(npx --yes neonctl@2.15.0 connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" --pooled --output json | tr -d '"')
          DIRECT=$(npx --yes neonctl@2.15.0 connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" --output json | tr -d '"')

          # Mask before use so a later failure cannot echo a credential into logs.
          echo "::add-mask::$POOLED"
          echo "::add-mask::$DIRECT"
          echo "DATABASE_URL=$POOLED" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$DIRECT" >> "$GITHUB_ENV"

          # The allowlist entry is the endpoint id with any -pooler suffix removed,
          # so one entry matches BOTH hostnames. See docs/DATABASE.md.
          HOST=$(printf '%s' "$DIRECT" | sed -E 's|^[^@]+@([^/:]+).*|\1|')
          ENDPOINT_ID=$(printf '%s' "$HOST" | cut -d. -f1 | sed -E 's/-pooler$//')
          echo "TEST_DATABASE_ALLOWLIST=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      # No `continue-on-error`, no `|| true`. A failed migration fails the job.
      - name: Apply migrations
        run: npm run db:migrate

      - name: Mark branch as a disposable test database
        run: npm run db:mark-test -- --host "${{ steps.neon.outputs.endpoint_id }}"

      - name: Integration tests
        run: npm run test:integration

      - name: Verify migration mechanics
        run: npm run db:verify

      # `always()` so a failure above still cleans up. A leaked branch on every
      # red build eventually exhausts the project's branch limit and takes CI
      # down for an unrelated reason.
      - name: Delete ephemeral Neon branch
        if: always()
        run: |
          npx --yes neonctl@2.15.0 branches delete "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" || \
            echo "::warning title=Branch cleanup failed::$BRANCH_NAME may still exist; the reaper will remove it"

  # ---------------------------------------------------------------------------
  # RELEASE GATE — the general-ledger regression suite (LL-036).
  #
  # The consolidated statement of the accounting invariants (GL-T001..GL-T015)
  # runs as its OWN required check, so a merge is blocked the moment any invariant
  # regresses — independently of the broader integration job. Its own ephemeral
  # Neon branch, so it is isolated from every other suite. Same fork-guard: this
  # cannot run for forks (no secrets), and it FAILS rather than skips when the
  # credentials are absent — an unrun release gate must never read as a pass.
  # ---------------------------------------------------------------------------
  gl-regression:
    name: GL regression suite (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      BRANCH_NAME: test/gl-${{ github.event.pull_request.number || 'push' }}-run-${{ github.run_id }}
      APP_ENV: test
    steps:
      - name: Require Neon credentials
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error title=Missing GitHub secrets::NEON_API_KEY / NEON_PROJECT_ID"
            echo "The GL regression suite is a release gate against a real database."
            echo "Failing rather than skipping — an unrun gate must never look like a pass."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Create ephemeral Neon branch
        id: neon
        run: |
          npx --yes neonctl@2.15.0 branches create \
            --project-id "$NEON_PROJECT_ID" --name "$BRANCH_NAME" --output json > /dev/null
          POOLED=$(npx --yes neonctl@2.15.0 connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" --pooled --output json | tr -d '"')
          DIRECT=$(npx --yes neonctl@2.15.0 connection-string "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" --output json | tr -d '"')
          echo "::add-mask::$POOLED"
          echo "::add-mask::$DIRECT"
          echo "DATABASE_URL=$POOLED" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$DIRECT" >> "$GITHUB_ENV"
          HOST=$(printf '%s' "$DIRECT" | sed -E 's|^[^@]+@([^/:]+).*|\1|')
          ENDPOINT_ID=$(printf '%s' "$HOST" | cut -d. -f1 | sed -E 's/-pooler$//')
          echo "TEST_DATABASE_ALLOWLIST=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Mark branch as a disposable test database
        run: npm run db:mark-test -- --host "${{ steps.neon.outputs.endpoint_id }}"

      - name: GL regression suite
        run: npm run test:gl

      - name: Delete ephemeral Neon branch
        if: always()
        run: |
          npx --yes neonctl@2.15.0 branches delete "$BRANCH_NAME" \
            --project-id "$NEON_PROJECT_ID" || \
            echo "::warning title=Branch cleanup failed::$BRANCH_NAME may still exist; the reaper will remove it"
