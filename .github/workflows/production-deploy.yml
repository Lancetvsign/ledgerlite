name: Production deploy

# Vercel's automatic deployment from `main` is DISABLED in vercel.json. That is
# deliberate and is the whole point of this workflow.
#
# Vercel's build step is the wrong place to run migrations against production:
#
#   - builds are not guaranteed to run exactly once (retries, concurrent builds)
#   - a build can succeed, apply a migration, and then FAIL TO PROMOTE, leaving
#     the database ahead of the deployed code — precisely the state that
#     expand -> migrate -> contract exists to avoid
#   - build environments are cached and may not carry the DATABASE_URL expected
#
# So migrations run here, as a discrete gated step, and the deployment is only
# promoted if they succeed. Promotion asks Vercel (REST) to build and deploy THIS
# commit as production — the Vercel CLI is deliberately not used: a team-scoped
# token cannot call the team endpoint the CLI insists on (403 team_unauthorized),
# while the project endpoints the REST path needs work with any token type.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-run migration is worse than a queued one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Whether production is configured to deploy yet (LL-056). Deliberately SEPARATE
  # from the CI gates' "fail, don't skip" rule: an unrun *test* must never read as a
  # pass, but a deploy is an ACTION, not a correctness gate — before go-live "did not
  # deploy" is the correct state, not a hidden failure. So when the production secrets
  # are absent this reports the fact and the deploy below SKIPS (neutral), instead of
  # reddening every push to `main`. Add the secrets (see docs/DEPLOYMENT.md) and the
  # deploy self-enables on the next push — no workflow edit required.
  preflight:
    name: Deploy configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      # Read as env (secrets are not allowed in `if:` expressions). Empty when unset.
      # The go-live signal is the PRODUCTION DATABASE URL, and only that: it is absent
      # exactly when production has not been provisioned. The Vercel creds
      # (VERCEL_TOKEN / ORG_ID / PROJECT_ID) are NOT a signal here — they already exist
      # for Preview deploys and Vercel linkage (LL-006), so keying the skip on them
      # would treat this repo's normal pre-go-live state as a misconfiguration. The
      # deploy job's own `Require credentials` step fail-closes on the FULL set before
      # touching production, so a prod DB set without Vercel creds still fails loudly.
      PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Detect whether production is configured to deploy
        id: check
        run: |
          if [ -n "$PRODUCTION_DATABASE_URL_UNPOOLED" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped (not configured)::PRODUCTION_DATABASE_URL_UNPOOLED is not set, so production is not provisioned yet. This is the expected, intentional state before go-live — see docs/DEPLOYMENT.md. Add the production secrets and the deploy runs on the next push to main."
          fi

  migrate-then-deploy:
    name: Migrate, then promote
    needs: preflight
    # Skip (neutral) rather than fail when production is not configured yet. When it
    # IS configured this runs the full gated deploy.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # attach required reviewers here for a manual gate
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The DIRECT endpoint. The pooled one is PgBouncer in transaction mode,
      # where the migration advisory lock silently protects nothing.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      APP_ENV: production
    steps:
      # Fail-closed guard immediately before touching the production database. Preflight
      # already gated us here, so this passes in the normal case; it exists so a partial
      # or malformed secret set can never reach `db:migrate` against production.
      - name: Require credentials
        run: |
          # Checks the JOB env names (the secrets are mapped above: PRODUCTION_DATABASE_URL →
          # DATABASE_URL, PRODUCTION_DATABASE_URL_UNPOOLED → DATABASE_URL_UNPOOLED). Checking
          # the secret names here instead would always fail — they do not exist in this shell.
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL DATABASE_URL_UNPOOLED; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing production credentials::${missing[*]} (GitHub secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID / PRODUCTION_DATABASE_URL / PRODUCTION_DATABASE_URL_UNPOOLED)"
            echo "Production cannot be deployed without these. See docs/DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # No continue-on-error, no `|| true`. If this fails the job stops here and
      # nothing is promoted: production keeps running the previous deployment
      # against the previous schema, which is a consistent state.
      - name: Apply migrations to production
        run: npm run db:migrate

      # Prove the token can reach the project BEFORE touching anything, and say exactly
      # what it can do. Prints HTTP status codes and slugs only — never the token. The
      # user/team endpoints are informational: a TEAM-scoped token answers 404/403 there
      # by design and is still fully able to deploy the project.
      - name: Verify Vercel access
        run: |
          api() { curl -s -o "$2" -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          u=$(api "/v2/user" /tmp/user.json);                echo "token → /v2/user: $u (account: $(jq -r '.user.username // "n/a (team-scoped token)"' /tmp/user.json))"
          t=$(api "/v2/teams/$VERCEL_ORG_ID" /tmp/team.json); echo "token → /v2/teams/<VERCEL_ORG_ID>: $t (team: $(jq -r '.slug // .error.code // "?"' /tmp/team.json))"
          p=$(api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" /tmp/project.json); echo "token → /v9/projects/<VERCEL_PROJECT_ID>?teamId=<VERCEL_ORG_ID>: $p (project: $(jq -r '.name // .error.code // "?"' /tmp/project.json))"
          if [ "$p" != "200" ]; then
            echo "::error title=Vercel access check failed::project=$p — VERCEL_TOKEN must be able to read the project VERCEL_PROJECT_ID under team VERCEL_ORG_ID."
            exit 1
          fi
          jq -r '.link.type // "none"' /tmp/project.json > /tmp/link_type
          jq -r '.link.repoId // empty' /tmp/project.json > /tmp/repo_id
          echo "git link: $(cat /tmp/link_type) repoId=$(cat /tmp/repo_id) (the deploy builds from this repo at $GITHUB_SHA)"
          [ "$(cat /tmp/link_type)" = "github" ] && [ -n "$(cat /tmp/repo_id)" ] || { echo "::error title=Project is not linked to GitHub::Vercel must have the GitHub integration linked to this project for git-source deployments."; exit 1; }

      # Only reached if migrations succeeded. Vercel clones THIS commit, builds it with the
      # Production environment, and — because target=production — aliases the production
      # domain to it when the build is READY. A failed build leaves production on the
      # previous deployment (the schema is expand-only, so old code + new schema is fine).
      - name: Promote to production (Vercel REST deployment of this commit)
        run: |
          repo_id=$(cat /tmp/repo_id)
          body=$(jq -n --arg name ledgerlite --arg project "$VERCEL_PROJECT_ID" --arg sha "$GITHUB_SHA" --argjson repoId "$repo_id" \
            '{name: $name, project: $project, target: "production", gitSource: {type: "github", repoId: $repoId, ref: "main", sha: $sha}}')
          resp=$(curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_ORG_ID&forceNew=1" -d "$body")
          id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then echo "::error title=Deployment not created::$(echo "$resp" | jq -c '.error // .')"; exit 1; fi
          echo "deployment $id → https://$(echo "$resp" | jq -r '.url') (inspect: $(echo "$resp" | jq -r '.inspectorUrl // "n/a"'))"
          for i in $(seq 1 80); do
            d=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_ORG_ID")
            state=$(echo "$d" | jq -r '.readyState // .status // "?"')
            echo "$(date -u +%H:%M:%S) $state"
            case "$state" in
              READY) echo "Production is now https://$(echo "$d" | jq -r '.url') — aliases: $(echo "$d" | jq -r '[.alias[]?] | join(", ")')"; exit 0 ;;
              ERROR|CANCELED) echo "::error title=Deployment $state::$(echo "$d" | jq -r '.errorMessage // "see the inspector URL above"')"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error title=Deployment timed out::still $state after 20 minutes"; exit 1
