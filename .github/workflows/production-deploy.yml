name: Production deploy

# Vercel's automatic deployment from `main` is DISABLED in vercel.json. That is
# deliberate and is the whole point of this workflow.
#
# Vercel's build step is the wrong place to run migrations against production:
#
#   - builds are not guaranteed to run exactly once (retries, concurrent builds)
#   - a build can succeed, apply a migration, and then FAIL TO PROMOTE, leaving
#     the database ahead of the deployed code — precisely the state that
#     expand -> migrate -> contract exists to avoid
#   - build environments are cached and may not carry the DATABASE_URL expected
#
# So migrations run here, as a discrete gated step, and the deployment is only
# promoted if they succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-run migration is worse than a queued one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Whether production is configured to deploy yet (LL-056). Deliberately SEPARATE
  # from the CI gates' "fail, don't skip" rule: an unrun *test* must never read as a
  # pass, but a deploy is an ACTION, not a correctness gate — before go-live "did not
  # deploy" is the correct state, not a hidden failure. So when the production secrets
  # are absent this reports the fact and the deploy below SKIPS (neutral), instead of
  # reddening every push to `main`. Add the secrets (see docs/DEPLOYMENT.md) and the
  # deploy self-enables on the next push — no workflow edit required.
  preflight:
    name: Deploy configured?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      # Read as env (secrets are not allowed in `if:` expressions). Empty when unset.
      # The go-live signal is the PRODUCTION DATABASE URL, and only that: it is absent
      # exactly when production has not been provisioned. The Vercel creds
      # (VERCEL_TOKEN / ORG_ID / PROJECT_ID) are NOT a signal here — they already exist
      # for Preview deploys and Vercel linkage (LL-006), so keying the skip on them
      # would treat this repo's normal pre-go-live state as a misconfiguration. The
      # deploy job's own `Require credentials` step fail-closes on the FULL set before
      # touching production, so a prod DB set without Vercel creds still fails loudly.
      PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Detect whether production is configured to deploy
        id: check
        run: |
          if [ -n "$PRODUCTION_DATABASE_URL_UNPOOLED" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped (not configured)::PRODUCTION_DATABASE_URL_UNPOOLED is not set, so production is not provisioned yet. This is the expected, intentional state before go-live — see docs/DEPLOYMENT.md. Add the production secrets and the deploy runs on the next push to main."
          fi

  migrate-then-deploy:
    name: Migrate, then promote
    needs: preflight
    # Skip (neutral) rather than fail when production is not configured yet. When it
    # IS configured this runs the full gated deploy.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # attach required reviewers here for a manual gate
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The DIRECT endpoint. The pooled one is PgBouncer in transaction mode,
      # where the migration advisory lock silently protects nothing.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      APP_ENV: production
    steps:
      # Fail-closed guard immediately before touching the production database. Preflight
      # already gated us here, so this passes in the normal case; it exists so a partial
      # or malformed secret set can never reach `db:migrate` against production.
      - name: Require credentials
        run: |
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_DATABASE_URL_UNPOOLED; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing GitHub secrets::${missing[*]}"
            echo "Production cannot be deployed without these. See docs/DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # No continue-on-error, no `|| true`. If this fails the job stops here and
      # nothing is promoted: production keeps running the previous deployment
      # against the previous schema, which is a consistent state.
      - name: Apply migrations to production
        run: npm run db:migrate

      - name: Build
        run: npx vercel@54.21.1 build --prod --token "$VERCEL_TOKEN"

      # Only reached if migrations succeeded.
      - name: Promote to production
        run: npx vercel@54.21.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
