name: Production deploy

# Vercel's automatic deployment from `main` is DISABLED in vercel.json. That is
# deliberate and is the whole point of this workflow.
#
# Vercel's build step is the wrong place to run migrations against production:
#
#   - builds are not guaranteed to run exactly once (retries, concurrent builds)
#   - a build can succeed, apply a migration, and then FAIL TO PROMOTE, leaving
#     the database ahead of the deployed code — precisely the state that
#     expand -> migrate -> contract exists to avoid
#   - build environments are cached and may not carry the DATABASE_URL expected
#
# So migrations run here, as a discrete gated step, and the deployment is only
# promoted if they succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-run migration is worse than a queued one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate-then-deploy:
    name: Migrate, then promote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # attach required reviewers here for a manual gate
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The DIRECT endpoint. The pooled one is PgBouncer in transaction mode,
      # where the migration advisory lock silently protects nothing.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      APP_ENV: production
    steps:
      - name: Require credentials
        run: |
          missing=()
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_DATABASE_URL_UNPOOLED; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Missing GitHub secrets::${missing[*]}"
            echo "Production cannot be deployed without these. See docs/DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # No continue-on-error, no `|| true`. If this fails the job stops here and
      # nothing is promoted: production keeps running the previous deployment
      # against the previous schema, which is a consistent state.
      - name: Apply migrations to production
        run: npm run db:migrate

      - name: Build
        run: npx vercel@54.21.1 build --prod --token "$VERCEL_TOKEN"

      # Only reached if migrations succeeded.
      - name: Promote to production
        run: npx vercel@54.21.1 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
